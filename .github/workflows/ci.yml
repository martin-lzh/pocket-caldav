name: CI

on:
  # Pull requests cover feature and dev branches; running on their pushes too
  # would test every commit twice.
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt pyflakes
      - name: Lint
        run: python -m pyflakes server.py tests
      - name: Test
        run: python -m pytest -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag pocket-caldav:ci .
      - name: Smoke test
        run: |
          docker run -d --name caldav -e ALLOW_REQUEST_BASE_URL=true -p 5232:5232 pocket-caldav:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5232/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5232/healthz
          curl -fsS http://127.0.0.1:5232/api/guide | head -n 3
          docker logs caldav
